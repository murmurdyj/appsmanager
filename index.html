<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#A8D4EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="入口" />
  <title>我的入口</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    :root{
      --bg:#F7F3E9;
      --panel:#FFFDF8;
      --card:#FFFFFF;
      --text:#3A3730;
      --muted:#8C8579;
      --brown:#A8D4EE;
      --brown2:#F5DC96;
      --chip:#EFE9DA;
      --danger:#C98C82;
      --shadow:0 12px 28px rgba(92, 86, 70, .09);
      --line:rgba(120, 112, 96, .14);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button,input,select,textarea{font-family:inherit}

    .app{
      width:100%;
      max-width:480px;
      min-height:100vh;
      margin:0 auto;
      background:linear-gradient(180deg,#FFFDF8 0%,#F2EDDF 100%);
      position:relative;
      overflow:hidden;
    }

    .screen{display:none;min-height:100vh;padding-bottom:92px}
    .screen.active{display:block}

    .header{
      padding:24px 20px 18px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .title h1{margin:0;font-size:30px;letter-spacing:-.03em}
    .title p{margin:5px 0 0;color:var(--muted);font-size:14px;font-weight:650}

    .icon-btn{
      width:46px;height:46px;border:0;border-radius:18px;background:rgba(255,255,255,.82);
      box-shadow:var(--shadow);font-size:22px;color:var(--text);display:grid;place-items:center;
    }

    .top-actions{display:flex;gap:10px}

    .search{
      position:relative;
      margin-top:6px;
    }
    .search input{
      width:100%;border:0;outline:0;border-radius:20px;background:rgba(255,255,255,.9);
      padding:15px 16px 15px 44px;font-size:15px;box-shadow:var(--shadow);
    }
    .search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5}

    .content{padding:4px 20px 20px}

    .section-head{
      display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;
    }
    .section-title{font-size:19px;font-weight:900;margin:0}
    .link-btn{border:0;background:transparent;color:#2F6A8C;font-weight:900;font-size:14px}

    .fav-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    }

    .fav-card{
      min-height:116px;border:1px solid var(--line);background:rgba(255,255,255,.86);
      border-radius:24px;box-shadow:var(--shadow);padding:14px 12px;text-decoration:none;color:inherit;
      display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
    }
    .fav-card:active,.item:active,.cat-card:active,.setting-item:active{transform:scale(.985)}

    .app-icon{
      width:46px;height:46px;border-radius:17px;
      background:linear-gradient(135deg,#EFE9DA,#F5DC96);
      display:grid;place-items:center;
      font-size:25px;flex:0 0 auto;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
    }
    .fav-name{font-weight:950;font-size:15px;line-height:1.15;width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .star{color:#D9A441;font-size:16px}

    .chips{
      display:flex;gap:9px;overflow-x:auto;padding:2px 1px 13px;margin:0 -1px;
      scrollbar-width:none;
    }
    .chips::-webkit-scrollbar{display:none}
    .chip{
      flex:0 0 auto;border:0;border-radius:999px;background:rgba(255,255,255,.88);
      padding:10px 15px;font-size:14px;font-weight:900;color:#6E6455;box-shadow:0 6px 16px rgba(92,86,70,.06);
    }
    .chip.active{background:var(--brown);color:#1F3F52;box-shadow:0 8px 18px rgba(92,86,70,.14)}

    .list{display:flex;flex-direction:column;gap:12px}
    .item{
      display:flex;align-items:center;gap:13px;width:100%;border:1px solid var(--line);border-radius:22px;
      background:rgba(255,255,255,.92);box-shadow:var(--shadow);padding:13px;text-decoration:none;color:inherit;
    }
    .item-main{flex:1;min-width:0}
    .name-row{display:flex;align-items:center;gap:7px;min-width:0}
    .name{font-size:16px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tag{font-size:12px;font-weight:900;color:#52664E;background:var(--chip);border-radius:999px;padding:3px 8px;white-space:nowrap}
    .desc{font-size:13px;color:var(--muted);font-weight:650;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .more{font-size:20px;color:#A69C8C;padding:6px}

    .empty{
      display:none;text-align:center;color:var(--muted);font-weight:800;padding:38px 8px;
    }

    .bottom-nav{
      position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;
      background:rgba(251,250,246,.88);backdrop-filter:blur(16px);
      border-top:1px solid rgba(116,109,96,.12);display:grid;grid-template-columns:repeat(4,1fr);
      padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:10;
    }
    .nav-btn{
      border:0;background:transparent;color:#8C8579;font-weight:900;font-size:12px;
      display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;
    }
    .nav-btn span{font-size:22px}
    .nav-btn.active{color:#2F6A8C}

    .fab{
      position:fixed;right:calc(50% - 220px);bottom:88px;width:62px;height:62px;border:0;border-radius:23px;
      background:var(--brown);color:#1F3F52;font-size:32px;box-shadow:0 16px 34px rgba(92,86,70,.18);z-index:12;
    }
    @media(max-width:480px){.fab{right:20px}}

    .cat-grid{
      display:grid;grid-template-columns:repeat(2,1fr);gap:13px;padding:4px 20px 110px;
    }
    .cat-card{
      min-height:122px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.9);
      box-shadow:var(--shadow);padding:17px;text-align:left;color:inherit;position:relative;
    }
    .cat-card .big{font-size:28px;margin-bottom:12px}
    .cat-card .cat-name{font-size:18px;font-weight:950}
    .cat-card .count{margin-top:5px;color:var(--muted);font-weight:750;font-size:13px}
    .cat-card .edit-actions{display:flex;gap:8px;margin-top:10px}
    .cat-card .edit-actions button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 0;font-size:13px;font-weight:900;color:var(--text)}
    .cat-card .edit-actions button.del{color:#A5584A}

    .page-title{
      padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between;
    }
    .page-title h2{margin:0;font-size:21px}
    .back{border:0;background:transparent;font-size:28px;color:var(--text);padding:4px}

    .form{
      padding:10px 20px 110px;display:flex;flex-direction:column;gap:14px;
    }
    .field label{display:block;font-size:13px;font-weight:950;color:#6E6455;margin:0 0 7px}
    .field input,.field select,.field textarea{
      width:100%;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.92);
      padding:14px;font-size:15px;outline:0;color:var(--text);box-shadow:0 7px 16px rgba(65,42,21,.06);
    }
    .field textarea{min-height:84px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .switch-row{
      display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.86);
      border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);
    }
    .switch-row strong{font-size:15px}
    .switch-row small{display:block;color:var(--muted);font-weight:750;margin-top:3px}
    .switch{width:52px;height:31px;appearance:none;background:#E4E0D4;border-radius:999px;position:relative;outline:0;transition:.2s}
    .switch:checked{background:var(--brown)}
    .switch:before{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:white;top:2px;left:2px;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .switch:checked:before{left:23px}

    .primary,.secondary,.danger-btn{
      width:100%;border:0;border-radius:18px;padding:15px 16px;font-size:16px;font-weight:950;
    }
    .primary{background:var(--brown);color:#1F3F52;box-shadow:0 12px 24px rgba(92,86,70,.16)}
    .secondary{background:#fff;border:1px solid var(--line);color:#6f6a5f}
    .danger-btn{background:#F6E4DF;color:#A5584A}
    .form-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}

    .detail-card{
      margin:6px 20px 110px;background:rgba(255,255,255,.9);border:1px solid var(--line);
      border-radius:28px;box-shadow:var(--shadow);padding:22px;
    }
    .detail-top{text-align:center;padding:12px 0 22px}
    .detail-top .app-icon{margin:0 auto 12px;width:70px;height:70px;border-radius:24px;font-size:38px}
    .detail-top h2{margin:0 0 9px;font-size:28px}
    .info-block{border-top:1px solid rgba(139,90,43,.12);padding:14px 0}
    .info-block strong{display:block;font-size:13px;color:#6E6455;margin-bottom:5px}
    .info-block p{margin:0;font-size:14px;line-height:1.5;color:#3A3730;word-break:break-all}
    .detail-actions{display:grid;gap:10px;margin-top:10px}
    .detail-actions.two{grid-template-columns:1fr 1fr}

    .settings-list{
      padding:10px 20px 110px;display:flex;flex-direction:column;gap:12px;
    }
    .setting-item{
      display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.9);
      box-shadow:var(--shadow);padding:16px;text-align:left;width:100%;
    }
    .setting-item .sicon{font-size:23px;width:32px;text-align:center}
    .setting-item strong{font-size:16px}
    .setting-item p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:13px}

    .modal{
      position:fixed;inset:0;background:rgba(36,25,16,.35);display:none;align-items:flex-end;justify-content:center;z-index:30;
    }
    .modal.show{display:flex}
    .sheet{
      width:100%;max-width:480px;background:var(--panel);border-radius:28px 28px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom));
      box-shadow:0 -18px 42px rgba(45,36,27,.24);
    }
    .sheet h3{margin:0 0 12px;font-size:20px}
    .sheet p{margin:0 0 16px;color:var(--muted);font-weight:700;line-height:1.5}
    .sheet-actions{display:grid;gap:10px}

    .hidden-file{display:none}

    .article-meta{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-size:12px;font-weight:700}
    .article-meta .dot{opacity:.5}
    .quick-add-row{display:flex;gap:8px;margin-bottom:4px}
    .quick-add-row input{flex:1}
    .btn-inline{width:auto;flex:0 0 auto;padding:0 16px}
    .sheet .field{margin-bottom:0}
    .sheet-form{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;max-height:52vh;overflow-y:auto}
  </style>
</head>

<body>
  <div class="app">
    <section id="homeScreen" class="screen active">
      <header class="header">
        <div class="topbar">
          <div class="title">
            <h1>我的入口</h1>
            <p>集中管理工作網頁與 Web App</p>
          </div>
          <div class="top-actions">
            <button class="icon-btn" onclick="focusSearch()">⌕</button>
            <button class="icon-btn" onclick="showScreen('settingsScreen')">⚙</button>
          </div>
        </div>
        <div class="search">
          <span>⌕</span>
          <input id="searchInput" placeholder="搜尋名稱、分類或關鍵字" oninput="renderHome()" />
        </div>
      </header>

      <main class="content">
        <div class="section-head">
          <p class="section-title">⭐ 常用</p>
          <button class="link-btn" onclick="setCategory('常用')">全部 ›</button>
        </div>
        <div id="favGrid" class="fav-grid"></div>

        <div class="section-head">
          <p class="section-title">分類</p>
          <button class="link-btn" onclick="showScreen('categoryScreen')">管理分類 ›</button>
        </div>
        <div id="chips" class="chips"></div>

        <div class="section-head">
          <p class="section-title">所有入口</p>
          <button class="link-btn" onclick="sortLatest()">最新使用⌄</button>
        </div>
        <div id="appList" class="list"></div>
        <div id="emptyState" class="empty">目前沒有符合的入口</div>
      </main>
    </section>

    <section id="articlesScreen" class="screen">
      <header class="header">
        <div class="topbar">
          <div class="title">
            <h1>文章收藏</h1>
            <p>儲存想看的文章與連結</p>
          </div>
          <div class="top-actions">
            <button class="icon-btn" onclick="focusArticleSearch()">⌕</button>
          </div>
        </div>
        <div class="search">
          <span>⌕</span>
          <input id="articleSearchInput" placeholder="搜尋標題、備註或分類" oninput="renderArticles()" />
        </div>
      </header>

      <main class="content">
        <div class="section-head">
          <p class="section-title">分類</p>
          <button class="link-btn" onclick="addCategory()">新增分類 ›</button>
        </div>
        <div id="articleChips" class="chips"></div>

        <div class="section-head">
          <p class="section-title">全部文章</p>
          <button class="link-btn" onclick="sortArticlesLatest()">最新加入⌄</button>
        </div>
        <div id="articleList" class="list"></div>
        <div id="articleEmptyState" class="empty">還沒有收藏任何文章，貼上連結或點右下角「＋」快速加入</div>
      </main>
    </section>

    <section id="articleDetailScreen" class="screen">
      <div class="page-title">
        <button class="back" onclick="goBack()">‹</button>
        <h2>文章詳情</h2>
        <button class="icon-btn" onclick="openQuickAdd(currentArticleDetailId)">⋯</button>
      </div>
      <div id="articleDetailCard" class="detail-card"></div>
    </section>

    <section id="categoryScreen" class="screen">
      <div class="page-title">
        <button class="back" onclick="goBack()">‹</button>
        <h2>分類</h2>
        <button class="icon-btn" onclick="addCategory()">＋</button>
      </div>
      <div class="section-head" style="padding:0 20px;margin-top:0">
        <p class="section-title" style="font-size:14px;color:var(--muted);font-weight:750">入口與文章共用同一套分類</p>
        <button class="link-btn" id="categoryEditToggle" onclick="toggleCategoryEditMode()">編輯分類</button>
      </div>
      <div id="catGrid" class="cat-grid"></div>
    </section>

    <section id="detailScreen" class="screen">
      <div class="page-title">
        <button class="back" onclick="goBack()">‹</button>
        <h2>入口資訊</h2>
        <button class="icon-btn" onclick="openForm(currentDetailId)">⋯</button>
      </div>
      <div id="detailCard" class="detail-card"></div>
    </section>

    <section id="formScreen" class="screen">
      <div class="page-title">
        <button class="back" onclick="goBack()">‹</button>
        <h2 id="formTitle">新增入口</h2>
        <button class="link-btn" onclick="saveForm()">儲存</button>
      </div>
      <form class="form" onsubmit="event.preventDefault(); saveForm();">
        <input type="hidden" id="entryId" />
        <div class="field">
          <label>名稱 *</label>
          <input id="entryName" required placeholder="例如：GA4" />
        </div>
        <div class="field">
          <label>網址 *</label>
          <input id="entryUrl" required placeholder="https://example.com" />
        </div>
        <div class="row">
          <div class="field">
            <label>分類 *</label>
            <select id="entryCategory"></select>
          </div>
          <div class="field">
            <label>圖示</label>
            <input id="entryIcon" placeholder="例如：📊" maxlength="4" />
          </div>
        </div>
        <div class="field">
          <label>說明</label>
          <textarea id="entryDesc" placeholder="這個入口是做什麼用的"></textarea>
        </div>
        <div class="switch-row">
          <div>
            <strong>設為常用</strong>
            <small>會顯示在首頁上方</small>
          </div>
          <input id="entryFavorite" type="checkbox" class="switch" />
        </div>
        <div class="form-actions">
          <button type="button" class="secondary" onclick="goBack()">取消</button>
          <button type="submit" class="primary">儲存</button>
        </div>
      </form>
    </section>

    <section id="settingsScreen" class="screen">
      <div class="page-title">
        <button class="back" onclick="goBack()">‹</button>
        <h2>設定</h2>
        <span style="width:46px"></span>
      </div>
      <div class="settings-list">
        <button class="setting-item" onclick="exportData()">
          <div class="sicon">⬇</div>
          <div><strong>備份與匯出</strong><p>下載一份 JSON 備份檔</p></div>
        </button>
        <button class="setting-item" onclick="document.getElementById('importFile').click()">
          <div class="sicon">⬆</div>
          <div><strong>匯入資料</strong><p>選擇備份檔還原入口資料</p></div>
        </button>
        <button class="setting-item" onclick="openResetModal()">
          <div class="sicon">🗑</div>
          <div><strong>清除本機資料</strong><p>刪除這台裝置儲存的所有入口</p></div>
        </button>
        <button class="setting-item" onclick="resetDefaultData()">
          <div class="sicon">↺</div>
          <div><strong>還原範例資料</strong><p>重新放回預設範例入口</p></div>
        </button>
        <div class="setting-item">
          <div class="sicon">ⓘ</div>
          <div><strong>關於</strong><p>版本 1.0.0｜資料存在本機瀏覽器 localStorage</p></div>
        </div>
      </div>
      <input id="importFile" class="hidden-file" type="file" accept="application/json,.json" onchange="importData(event)" />
    </section>

    <button class="fab" id="fab" onclick="fabAction()">＋</button>

    <nav class="bottom-nav">
      <button class="nav-btn active" id="navHome" onclick="showScreen('homeScreen')"><span>⌂</span>首頁</button>
      <button class="nav-btn" id="navArticles" onclick="showScreen('articlesScreen')"><span>📰</span>文章</button>
      <button class="nav-btn" id="navCategory" onclick="showScreen('categoryScreen')"><span>▦</span>分類</button>
      <button class="nav-btn" id="navSettings" onclick="showScreen('settingsScreen')"><span>⚙</span>設定</button>
    </nav>

    <div id="modal" class="modal">
      <div class="sheet">
        <h3 id="modalTitle">確認</h3>
        <p id="modalText">確定要執行嗎？</p>
        <div class="sheet-actions">
          <button id="modalConfirm" class="danger-btn">確認</button>
          <button class="secondary" onclick="closeModal()">取消</button>
        </div>
      </div>
    </div>

    <div id="quickAddModal" class="modal">
      <div class="sheet">
        <h3 id="quickAddTitle">快速加入文章</h3>
        <div class="sheet-form">
          <div class="field">
            <label>網址 *</label>
            <div class="quick-add-row">
              <input id="quickUrl" placeholder="貼上文章或貼文連結" />
              <button type="button" class="secondary btn-inline" onclick="pasteQuickUrl()">貼上</button>
            </div>
          </div>
          <div class="field">
            <label>標題</label>
            <input id="quickTitle" placeholder="留空則自動帶入網址" />
          </div>
          <div class="field">
            <label>分類</label>
            <select id="quickCategory"></select>
          </div>
          <div class="field">
            <label>備註</label>
            <textarea id="quickNote" placeholder="想記錄的重點或原因"></textarea>
          </div>
        </div>
        <div class="sheet-actions">
          <button class="primary" onclick="saveQuickArticle()">儲存</button>
          <button class="secondary" onclick="closeQuickAdd()">取消</button>
        </div>
      </div>
    </div>
  </div>

<script>
const STORAGE_KEY = "my_web_app_launcher_v1";

const defaultData = {
  categories: ["全部", "AI", "科技", "理財", "泰語", "DJ", "吉他", "音樂", "Jennie", "lingorm", "娛樂", "生活", "健康", "閱讀", "工作", "待處理"],
  articles: [],
  entries: [
    { id: cryptoId(), name: "GA4", url: "https://analytics.google.com/", category: "工作", desc: "Google Analytics 4 流量分析", icon: "📊", favorite: true, lastUsed: 0 },
    { id: cryptoId(), name: "家照活動前台", url: "https://workdai.github.io/care-platform/", category: "生活", desc: "查詢各縣市家照活動資訊", icon: "🤝", favorite: true, lastUsed: 0 },
    { id: cryptoId(), name: "Google 表單後台", url: "https://forms.google.com/", category: "工作", desc: "活動上傳表單與統計", icon: "📝", favorite: true, lastUsed: 0 },
    { id: cryptoId(), name: "Notion", url: "https://www.notion.so/", category: "生活", desc: "筆記、文件與專案整理", icon: "📒", favorite: false, lastUsed: 0 },
    { id: cryptoId(), name: "Google Sheet", url: "https://sheets.google.com/", category: "工作", desc: "資料表與統計", icon: "📗", favorite: false, lastUsed: 0 },
    { id: cryptoId(), name: "GitHub", url: "https://github.com/", category: "科技", desc: "程式碼管理與部署", icon: "🐙", favorite: false, lastUsed: 0 },
    { id: cryptoId(), name: "ChatGPT", url: "https://chatgpt.com/", category: "科技", desc: "AI 對話與工作輔助", icon: "🌀", favorite: false, lastUsed: 0 }
  ]
};

let data = loadData();
let activeCategory = "全部";
let currentDetailId = null;
let activeArticleCategory = "全部";
let currentArticleDetailId = null;
let quickAddEditingId = null;
let categoryEditMode = false;

function cryptoId(){
  return "id_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function migrateData(parsed){
  if(!parsed.articles) parsed.articles = [];
  if(!parsed.categories) parsed.categories = structuredClone(defaultData.categories);
  if(parsed.articleCategories){
    parsed.articleCategories.forEach(c => { if(!parsed.categories.includes(c)) parsed.categories.push(c); });
    delete parsed.articleCategories;
  }
  return parsed;
}

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
    return structuredClone(defaultData);
  }
  try{
    const parsed = JSON.parse(raw);
    if(!parsed.entries || !parsed.categories) throw new Error();
    return migrateData(parsed);
  }catch{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
    return structuredClone(defaultData);
  }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

const tabScreens = ["homeScreen", "articlesScreen", "categoryScreen", "settingsScreen"];
let screenHistory = [];

function activateScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(n => n.classList.remove("active"));
  if(id === "homeScreen") document.getElementById("navHome").classList.add("active");
  if(id === "articlesScreen") document.getElementById("navArticles").classList.add("active");
  if(id === "categoryScreen") document.getElementById("navCategory").classList.add("active");
  if(id === "settingsScreen") document.getElementById("navSettings").classList.add("active");

  const hiddenFabScreens = ["settingsScreen", "formScreen", "detailScreen", "categoryScreen", "articleDetailScreen"];
  document.getElementById("fab").style.display = hiddenFabScreens.includes(id) ? "none" : "block";

  renderAll();
}

function showScreen(id){
  const current = document.querySelector(".screen.active")?.id;
  if(current && current !== id){
    if(tabScreens.includes(id)) screenHistory = [];
    else screenHistory.push(current);
  }
  activateScreen(id);
}

function goBack(){
  const prev = screenHistory.pop();
  activateScreen(prev || "homeScreen");
}

function fabAction(){
  const activeId = document.querySelector(".screen.active").id;
  if(activeId === "articlesScreen") openQuickAdd(null);
  else openForm(null);
}

function focusSearch(){
  showScreen("homeScreen");
  setTimeout(() => document.getElementById("searchInput").focus(), 50);
}

function normalizeUrl(url){
  const trimmed = url.trim();
  if(!trimmed) return "";
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return "https://" + trimmed;
}

function openEntry(id){
  const entry = data.entries.find(e => e.id === id);
  if(!entry) return;
  entry.lastUsed = Date.now();
  saveData();
  window.open(entry.url, "_blank", "noopener");
}

function openDetail(id){
  currentDetailId = id;
  const entry = data.entries.find(e => e.id === id);
  if(!entry) return;
  const used = entry.lastUsed ? new Date(entry.lastUsed).toLocaleString("zh-TW") : "尚未記錄";
  document.getElementById("detailCard").innerHTML = `
    <div class="detail-top">
      <div class="app-icon">${escapeHtml(entry.icon || "🔗")}</div>
      <h2>${escapeHtml(entry.name)}</h2>
      <span class="tag">${escapeHtml(entry.category)}</span>
      ${entry.favorite ? '<span class="star"> ★</span>' : ''}
    </div>
    <div class="info-block"><strong>網址</strong><p>${escapeHtml(entry.url)}</p></div>
    <div class="info-block"><strong>說明</strong><p>${escapeHtml(entry.desc || "未填寫")}</p></div>
    <div class="info-block"><strong>最後使用</strong><p>${used}</p></div>
    <div class="detail-actions">
      <button class="primary" onclick="openEntry('${entry.id}')">開啟網站 ↗</button>
      <div class="detail-actions two">
        <button class="secondary" onclick="openForm('${entry.id}')">編輯</button>
        <button class="danger-btn" onclick="confirmDelete('${entry.id}')">刪除</button>
      </div>
    </div>
  `;
  showScreen("detailScreen");
}

function renderHome(){
  const keyword = document.getElementById("searchInput")?.value?.trim().toLowerCase() || "";
  const entries = data.entries.filter(e => {
    const catMatch = activeCategory === "全部" || activeCategory === "常用" ? (activeCategory === "全部" ? true : e.favorite) : e.category === activeCategory;
    const text = `${e.name} ${e.category} ${e.desc} ${e.url}`.toLowerCase();
    return catMatch && text.includes(keyword);
  });

  document.getElementById("favGrid").innerHTML = data.entries.filter(e => e.favorite).slice(0,6).map(e => `
    <a class="fav-card" href="javascript:void(0)" onclick="openEntry('${e.id}')" oncontextmenu="openDetail('${e.id}');return false;">
      <div class="app-icon">${escapeHtml(e.icon || "🔗")}</div>
      <div class="fav-name">${escapeHtml(e.name)} <span class="star">★</span></div>
    </a>
  `).join("");

  const chips = ["全部", "常用", ...data.categories.filter(c => c !== "全部")];
  document.getElementById("chips").innerHTML = chips.map(c => `
    <button class="chip ${c === activeCategory ? "active" : ""}" onclick="setCategory('${escapeAttr(c)}')">${escapeHtml(c)}</button>
  `).join("");

  document.getElementById("appList").innerHTML = entries.map(e => `
    <div class="item" onclick="openDetail('${e.id}')">
      <div class="app-icon">${escapeHtml(e.icon || "🔗")}</div>
      <div class="item-main">
        <div class="name-row"><div class="name">${escapeHtml(e.name)}</div><span class="tag">${escapeHtml(e.category)}</span></div>
        <div class="desc">${escapeHtml(e.desc || e.url)}</div>
      </div>
      <div class="more">⋮</div>
    </div>
  `).join("");

  document.getElementById("emptyState").style.display = entries.length ? "none" : "block";
}

function renderCategories(){
  const icons = { "全部":"▦", "AI":"🤖", "科技":"💻", "理財":"💰", "泰語":"🇹🇭", "DJ":"🎧", "吉他":"🎸", "音樂":"🎵", "Jennie":"🌸", "lingorm":"🧴", "娛樂":"🎬", "生活":"🏡", "健康":"🩺", "閱讀":"📖", "工作":"💼", "待處理":"📌" };
  const cats = data.categories.filter(c => c !== "全部");
  document.getElementById("categoryEditToggle").textContent = categoryEditMode ? "完成" : "編輯分類";

  document.getElementById("catGrid").innerHTML = cats.map(c => {
    const count = data.entries.filter(e => e.category === c).length + data.articles.filter(a => a.category === c).length;
    if(categoryEditMode){
      return `
        <div class="cat-card">
          <div class="big">${icons[c] || "📁"}</div>
          <div class="cat-name">${escapeHtml(c)}</div>
          <div class="count">${count} 筆資料</div>
          <div class="edit-actions">
            <button onclick="renameCategory('${escapeAttr(c)}')">改名</button>
            <button class="del" onclick="deleteCategory('${escapeAttr(c)}')">刪除</button>
          </div>
        </div>
      `;
    }
    return `
      <button class="cat-card" onclick="setCategory('${escapeAttr(c)}');showScreen('homeScreen')">
        <div class="big">${icons[c] || "📁"}</div>
        <div class="cat-name">${escapeHtml(c)}</div>
        <div class="count">${count} 筆資料</div>
      </button>
    `;
  }).join("");
}

function toggleCategoryEditMode(){
  categoryEditMode = !categoryEditMode;
  renderCategories();
}

function addCategory(){
  const name = prompt("新增分類名稱");
  if(!name) return;
  const trimmed = name.trim();
  if(!trimmed || trimmed === "全部") return;
  if(data.categories.includes(trimmed)){
    alert("這個分類已經存在了");
    return;
  }
  data.categories.push(trimmed);
  saveData();
  renderAll();
}

function renameCategory(oldName){
  const name = prompt("重新命名分類", oldName);
  if(!name) return;
  const trimmed = name.trim();
  if(!trimmed || trimmed === oldName) return;
  if(trimmed === "全部" || data.categories.includes(trimmed)){
    alert("名稱不能是「全部」，也不能跟現有分類重複");
    return;
  }
  const idx = data.categories.indexOf(oldName);
  if(idx === -1) return;
  data.categories[idx] = trimmed;
  data.entries.forEach(e => { if(e.category === oldName) e.category = trimmed; });
  data.articles.forEach(a => { if(a.category === oldName) a.category = trimmed; });
  if(activeCategory === oldName) activeCategory = trimmed;
  if(activeArticleCategory === oldName) activeArticleCategory = trimmed;
  saveData();
  renderAll();
}

function deleteCategory(name){
  const total = data.entries.filter(e => e.category === name).length + data.articles.filter(a => a.category === name).length;
  const warn = total
    ? `這個分類目前有 ${total} 筆資料。刪除分類後，這些項目不會被刪除，但分類清單中不會再看到它們，之後可以到「編輯」裡改成別的分類。確定要刪除嗎？`
    : "確定要刪除這個分類嗎？";
  openModal("刪除分類", warn, () => {
    data.categories = data.categories.filter(c => c !== name);
    if(activeCategory === name) activeCategory = "全部";
    if(activeArticleCategory === name) activeArticleCategory = "全部";
    saveData();
    closeModal();
    renderAll();
  });
}

function renderCategoryOptions(selected){
  const select = document.getElementById("entryCategory");
  select.innerHTML = data.categories.filter(c => c !== "全部").map(c => `
    <option value="${escapeAttr(c)}" ${c === selected ? "selected" : ""}>${escapeHtml(c)}</option>
  `).join("");
}

function renderAll(){
  if(document.getElementById("homeScreen").classList.contains("active")) renderHome();
  if(document.getElementById("articlesScreen").classList.contains("active")) renderArticles();
  renderCategories();
}

function domainOf(url){
  try{ return new URL(url).hostname.replace(/^www\./, ""); }
  catch{ return url; }
}

function formatDate(ts){
  if(!ts) return "尚未記錄";
  return new Date(ts).toLocaleDateString("zh-TW", { year:"numeric", month:"2-digit", day:"2-digit" });
}

function focusArticleSearch(){
  showScreen("articlesScreen");
  setTimeout(() => document.getElementById("articleSearchInput").focus(), 50);
}

function setArticleCategory(cat){
  activeArticleCategory = cat;
  renderArticles();
}

function sortArticlesLatest(){
  data.articles.sort((a,b) => (b.addedAt || 0) - (a.addedAt || 0));
  saveData();
  renderArticles();
}

function renderArticles(){
  const keyword = document.getElementById("articleSearchInput")?.value?.trim().toLowerCase() || "";
  const list = data.articles.filter(a => {
    const catMatch = activeArticleCategory === "全部" || a.category === activeArticleCategory;
    const text = `${a.title} ${a.category} ${a.note} ${a.url}`.toLowerCase();
    return catMatch && text.includes(keyword);
  });

  document.getElementById("articleChips").innerHTML = data.categories.map(c => `
    <button class="chip ${c === activeArticleCategory ? "active" : ""}" onclick="setArticleCategory('${escapeAttr(c)}')">${escapeHtml(c)}</button>
  `).join("");

  document.getElementById("articleList").innerHTML = list.map(a => `
    <div class="item" onclick="openArticleDetail('${a.id}')">
      <div class="app-icon">🔖</div>
      <div class="item-main">
        <div class="name-row"><div class="name">${escapeHtml(a.title || domainOf(a.url))}</div><span class="tag">${escapeHtml(a.category)}</span></div>
        <div class="desc">${escapeHtml(a.note || a.url)}</div>
        <div class="article-meta"><span>${escapeHtml(domainOf(a.url))}</span><span class="dot">·</span><span>${formatDate(a.addedAt)}</span></div>
      </div>
      <div class="more">⋮</div>
    </div>
  `).join("");

  document.getElementById("articleEmptyState").style.display = list.length ? "none" : "block";
}

function openArticleDetail(id){
  currentArticleDetailId = id;
  const a = data.articles.find(x => x.id === id);
  if(!a) return;
  document.getElementById("articleDetailCard").innerHTML = `
    <div class="detail-top">
      <div class="app-icon">🔖</div>
      <h2>${escapeHtml(a.title || domainOf(a.url))}</h2>
      <span class="tag">${escapeHtml(a.category)}</span>
    </div>
    <div class="info-block"><strong>網址</strong><p>${escapeHtml(a.url)}</p></div>
    <div class="info-block"><strong>備註</strong><p>${escapeHtml(a.note || "未填寫")}</p></div>
    <div class="info-block"><strong>加入時間</strong><p>${formatDate(a.addedAt)}</p></div>
    <div class="detail-actions">
      <button class="primary" onclick="openArticleLink('${a.id}')">開啟原文 ↗</button>
      <div class="detail-actions two">
        <button class="secondary" onclick="openQuickAdd('${a.id}')">編輯</button>
        <button class="danger-btn" onclick="confirmDeleteArticle('${a.id}')">刪除</button>
      </div>
    </div>
  `;
  showScreen("articleDetailScreen");
}

function openArticleLink(id){
  const a = data.articles.find(x => x.id === id);
  if(!a) return;
  window.open(a.url, "_blank", "noopener");
}

function confirmDeleteArticle(id){
  const a = data.articles.find(x => x.id === id);
  if(!a) return;
  openModal("刪除文章", `確定要刪除「${a.title || domainOf(a.url)}」嗎？`, () => {
    data.articles = data.articles.filter(x => x.id !== id);
    saveData();
    closeModal();
    showScreen("articlesScreen");
  });
}

function renderQuickCategoryOptions(selected){
  const select = document.getElementById("quickCategory");
  select.innerHTML = data.categories.filter(c => c !== "全部").map(c => `
    <option value="${escapeAttr(c)}" ${c === selected ? "selected" : ""}>${escapeHtml(c)}</option>
  `).join("");
}

function openQuickAdd(id, prefillUrl){
  quickAddEditingId = id || null;
  const editing = Boolean(id);
  const a = editing ? data.articles.find(x => x.id === id) : null;

  document.getElementById("quickAddTitle").textContent = editing ? "編輯文章" : "快速加入文章";
  renderQuickCategoryOptions(a?.category || "待處理");
  document.getElementById("quickUrl").value = a?.url || prefillUrl || "";
  document.getElementById("quickTitle").value = a?.title || "";
  document.getElementById("quickNote").value = a?.note || "";

  document.getElementById("quickAddModal").classList.add("show");
  if(!editing && !prefillUrl) setTimeout(() => document.getElementById("quickUrl").focus(), 50);
}

function closeQuickAdd(){
  document.getElementById("quickAddModal").classList.remove("show");
}

async function pasteQuickUrl(){
  try{
    const text = await navigator.clipboard.readText();
    if(text) document.getElementById("quickUrl").value = text.trim();
  }catch{
    alert("無法讀取剪貼簿，請手動貼上網址");
  }
}

function saveQuickArticle(){
  const url = normalizeUrl(document.getElementById("quickUrl").value);
  if(!url){
    alert("請輸入網址");
    return;
  }
  const title = document.getElementById("quickTitle").value.trim();
  const category = document.getElementById("quickCategory").value || "待處理";
  const note = document.getElementById("quickNote").value.trim();

  if(quickAddEditingId){
    const entry = data.articles.find(x => x.id === quickAddEditingId);
    if(entry) Object.assign(entry, { url, title, category, note });
  }else{
    data.articles.unshift({ id: cryptoId(), url, title, category, note, addedAt: Date.now() });
  }

  saveData();
  closeQuickAdd();
  activeArticleCategory = "全部";
  showScreen("articlesScreen");
}


function setCategory(cat){
  activeCategory = cat;
  renderHome();
}

function sortLatest(){
  data.entries.sort((a,b) => (b.lastUsed || 0) - (a.lastUsed || 0));
  saveData();
  renderHome();
}

function openForm(id){
  document.getElementById("entryId").value = id || "";
  const editing = Boolean(id);
  document.getElementById("formTitle").textContent = editing ? "編輯入口" : "新增入口";

  const entry = editing ? data.entries.find(e => e.id === id) : null;
  renderCategoryOptions(entry?.category || "工作");

  document.getElementById("entryName").value = entry?.name || "";
  document.getElementById("entryUrl").value = entry?.url || "";
  document.getElementById("entryCategory").value = entry?.category || "工作";
  document.getElementById("entryIcon").value = entry?.icon || "🔗";
  document.getElementById("entryDesc").value = entry?.desc || "";
  document.getElementById("entryFavorite").checked = entry?.favorite || false;

  showScreen("formScreen");
}

function saveForm(){
  const id = document.getElementById("entryId").value;
  const name = document.getElementById("entryName").value.trim();
  const url = normalizeUrl(document.getElementById("entryUrl").value);
  const category = document.getElementById("entryCategory").value;
  const icon = document.getElementById("entryIcon").value.trim() || "🔗";
  const desc = document.getElementById("entryDesc").value.trim();
  const favorite = document.getElementById("entryFavorite").checked;

  if(!name || !url){
    alert("名稱和網址必填");
    return;
  }

  if(id){
    const entry = data.entries.find(e => e.id === id);
    if(entry) Object.assign(entry, { name, url, category, icon, desc, favorite });
  }else{
    data.entries.unshift({ id: cryptoId(), name, url, category, icon, desc, favorite, lastUsed: 0 });
  }

  saveData();
  activeCategory = "全部";
  showScreen("homeScreen");
}

function confirmDelete(id){
  const entry = data.entries.find(e => e.id === id);
  if(!entry) return;
  openModal("刪除入口", `確定要刪除「${entry.name}」嗎？`, () => {
    data.entries = data.entries.filter(e => e.id !== id);
    saveData();
    closeModal();
    showScreen("homeScreen");
  });
}

function exportData(){
  const payload = {
    app: "my-web-app-launcher",
    version: "1.0.0",
    exportedAt: new Date().toISOString(),
    data
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `my-links-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const imported = parsed.data || parsed;
      if(!imported.entries || !imported.categories) throw new Error("格式不符");
      migrateData(imported);
      openModal("匯入資料", "匯入後會覆蓋目前這台裝置的資料，確定要繼續嗎？", () => {
        data = imported;
        saveData();
        closeModal();
        activeCategory = "全部";
        activeArticleCategory = "全部";
        showScreen("homeScreen");
        alert("匯入完成");
      });
    }catch(err){
      alert("匯入失敗，請確認是正確的備份 JSON 檔。");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function openResetModal(){
  openModal("清除本機資料", "這會刪除目前這台裝置儲存的所有入口資料。建議先備份。", () => {
    localStorage.removeItem(STORAGE_KEY);
    data = structuredClone(defaultData);
    saveData();
    closeModal();
    activeCategory = "全部";
    showScreen("homeScreen");
  });
}

function resetDefaultData(){
  openModal("還原範例資料", "這會覆蓋目前資料並放回預設範例。確定嗎？", () => {
    data = structuredClone(defaultData);
    saveData();
    closeModal();
    activeCategory = "全部";
    showScreen("homeScreen");
  });
}

function openModal(title, text, onConfirm){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalText").textContent = text;
  document.getElementById("modalConfirm").onclick = onConfirm;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str).replace(/`/g, "&#096;"); }

renderAll();
</script>
</body>
